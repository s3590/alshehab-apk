name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: ☕ Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 📦 Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/assets -D --legacy-peer-deps
        npm install @capgo/capacitor-native-biometric@5 @capacitor/app@5 @capacitor/splash-screen@5 @capacitor/push-notifications@5 @capacitor-firebase/analytics@5 @capacitor-firebase/crashlytics@5 --legacy-peer-deps

    - name: ⚙️ Prepare Config & Web Assets
      run: |
        mkdir -p www
        echo "<html><body style='background-color:#050b14; color:white; text-align:center; margin-top:50%;'>Loading...</body></html>" > www/index.html
        
        node -e "
          const fs = require('fs');
          let c = { plugins: {}, server: {} };
          try { c = JSON.parse(fs.readFileSync('capacitor.config.json')); } catch(e) {}
          c.plugins = c.plugins || {};
          c.plugins.SplashScreen = { launchShowDuration: 3000, launchAutoHide: false, backgroundColor: '#050b14', androidSplashResourceName: 'splash', androidScaleType: 'CENTER_CROP' };
          c.server = { url: 'https://my-bot-ehio.onrender.com', cleartext: true };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2 ));
        "

    - name: 🤖 Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: 🎨 Generate App Icons
      run: |
        mkdir -p assets
        curl --fail --retry 5 --retry-all-errors --retry-delay 5 -o assets/icon.png https://my-bot-ehio.onrender.com/static/logo.png
        curl --fail --retry 5 --retry-all-errors --retry-delay 5 -o assets/splash.png https://my-bot-ehio.onrender.com/static/logo.png
        npx capacitor-assets generate --android

    - name: 🎵 Add Custom Sound (Optional )
      run: |
        mkdir -p android/app/src/main/res/raw
        cp bell.mp3 android/app/src/main/res/raw/bell.mp3 || echo "bell.mp3 not found, skipping..."

    - name: 🔥 Inject Firebase & Fix SDK
      run: |
        cp google-services.json android/app/ || echo "Warning: google-services.json not found!"
        sed -i 's/minSdkVersion = .*/minSdkVersion = 22/g' android/variables.gradle
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"\n        classpath "com.google.firebase:firebase-crashlytics-gradle:2.9.9"' android/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        echo "apply plugin: 'com.google.firebase.crashlytics'" >> android/app/build.gradle

    - name: 🏗️ Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: 🔐 Sign APK Manually (The Ultimate Fix)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # 1. استخراج ملف المفتاح من النص المشفر
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        
        # 2. البحث عن أحدث إصدار من أدوات بناء الأندرويد الموجودة في السيرفر تلقائياً
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        ZIPALIGN=$BUILD_TOOLS_DIR/zipalign
        APKSIGNER=$BUILD_TOOLS_DIR/apksigner
        
        # 3. تحديد مسار التطبيق غير الموقع
        APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
        ALIGNED_APK="app-aligned.apk"
        SIGNED_APK="Alshehab-Pro.apk"
        
        # 4. محاذاة التطبيق (Zipalign)
        $ZIPALIGN -v -p 4 $APK_PATH $ALIGNED_APK
        
        # 5. توقيع التطبيق (Apksigner)
        $APKSIGNER sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out $SIGNED_APK $ALIGNED_APK

    - name: 🚀 Publish to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "الشهاب Pro - أحدث إصدار 🚀"
        body: "قم بتحميل أحدث نسخة رسمية وموقعة من تطبيق الشهاب Pro. (جاهز للتثبيت على جميع الهواتف)"
        files: Alshehab-Pro.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
