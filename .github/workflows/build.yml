name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/assets -D
        npm install @capgo/capacitor-native-biometric

    - name: Build local www folder (Ultimate Hybrid Mode)
      run: |
        mkdir -p www/static
        # 1. جلب الواجهة المجهزة بالأرقام الحقيقية من السيرفر
        curl -sL https://my-bot-ehio.onrender.com/ -o www/index.html
        
        # 2. جلب ملفات الأوفلاين الأساسية من السيرفر مباشرة
        curl -sL https://my-bot-ehio.onrender.com/firebase-messaging-sw.js -o www/firebase-messaging-sw.js
        curl -sL https://my-bot-ehio.onrender.com/static/logo.png -o www/static/logo.png
        curl -sL https://my-bot-ehio.onrender.com/static/manifest.json -o www/static/manifest.json
        
        # 3. إزالة رابط السيرفر من إعدادات Capacitor لكي يفتح من داخل الهاتف
        node -e "const fs=require('fs'  ); try { let c=JSON.parse(fs.readFileSync('capacitor.config.json')); if(c.server) delete c.server.url; fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2)); } catch(e) {}"

    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Generate App Icons
      run: |
        mkdir -p assets
        curl -o assets/icon.png https://my-bot-ehio.onrender.com/static/logo.png
        curl -o assets/splash.png https://my-bot-ehio.onrender.com/static/logo.png
        npx capacitor-assets generate --android

    - name: Add Custom Sound
      run: |
        mkdir -p android/app/src/main/res/raw
        cp bell.mp3 android/app/src/main/res/raw/bell.mp3

    - name: Copy google-services.json
      run: cp google-services.json android/app/

    - name: Inject Firebase
      run: |
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"' android/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: Alshehab-Pro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
