name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/assets -D

    - name: Create dummy www folder
      run: mkdir www && echo "<html><body>Loading...</body></html>" > www/index.html

    - name: Add Android Platform
      run: npx cap add android

    - name: Generate App Icons
      run: |
        mkdir assets
        curl -o assets/icon.png https://my-bot-ehio.onrender.com/static/logo.png
        curl -o assets/splash.png https://my-bot-ehio.onrender.com/static/logo.png
        npx capacitor-assets generate --android

    - name: Copy google-services.json
      run: cp google-services.json android/app/

    - name: Inject Firebase
      run: |
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"' android/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: Alshehab-Pro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
