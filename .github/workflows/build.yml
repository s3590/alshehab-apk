name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # 🌟 الإصلاح: استخدام الإصدار المستقر v4

    - name: Setup Node.js
      uses: actions/setup-node@v4 # 🌟 الإصلاح: استخدام الإصدار المستقر v4
      with:
        node-version: '20' # 🌟 الإصلاح: Node 20 هو الأفضل والأكثر استقراراً لـ Capacitor 5

    - name: Setup Java
      uses: actions/setup-java@v4 # 🌟 الإصلاح: استخدام الإصدار المستقر v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/assets -D --legacy-peer-deps
        npm install @capgo/capacitor-native-biometric@5 --legacy-peer-deps
        npm install @capacitor/app@5 --legacy-peer-deps
        npm install @capacitor/splash-screen@5 --legacy-peer-deps
        npm install @capacitor-firebase/analytics@5 --legacy-peer-deps
        npm install @capacitor-firebase/crashlytics@5 --legacy-peer-deps

    - name: Prepare www folder
      run: |
        mkdir -p www
        echo "<html><body>Loading...</body></html>" > www/index.html
        # 🌟 الإصلاح الأمني: دمج إعدادات شاشة الإقلاع بدون مسح إعدادات الإشعارات (PushNotifications)!
        node -e "const fs=require('fs'); try { let c=JSON.parse(fs.readFileSync('capacitor.config.json')); c.plugins = c.plugins || {}; c.plugins.SplashScreen = { launchShowDuration: 3000, launchAutoHide: false, backgroundColor: '#050b14', androidSplashResourceName: 'splash', androidScaleType: 'CENTER_CROP' }; fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2)); } catch(e) { console.error(e); }"

    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Generate App Icons
      run: |
        mkdir -p assets
        # 🌟 الإصلاح: إضافة نظام إعادة المحاولة (Retry) لانتظار استيقاظ سيرفر Render وتجنب تحميل صفحة HTML بالخطأ
        curl --retry 5 --retry-all-errors --retry-delay 5 -o assets/icon.png https://my-bot-ehio.onrender.com/static/logo.png
        curl --retry 5 --retry-all-errors --retry-delay 5 -o assets/splash.png https://my-bot-ehio.onrender.com/static/logo.png
        npx capacitor-assets generate --android

    - name: Add Custom Sound
      run: |
        mkdir -p android/app/src/main/res/raw
        cp bell.mp3 android/app/src/main/res/raw/bell.mp3 || true

    - name: Copy google-services.json
      run: |
        # 🌟 نسخ الملف الموجود في المستودع مباشرة إلى مجلد الأندرويد
        cp google-services.json android/app/

    - name: Inject Firebase & Crashlytics
      run: |
        # 🌟 إضافة || true لمنع انهيار البناء إذا اختلف هيكل ملف Gradle
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"\n        classpath "com.google.firebase:firebase-crashlytics-gradle:2.9.9"' android/build.gradle || true
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        echo "apply plugin: 'com.google.firebase.crashlytics'" >> android/app/build.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4 # 🌟 الإصلاح: استخدام الإصدار المستقر v4
      with:
        name: Alshehab-Pro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
